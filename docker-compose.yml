version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: fastapi_backend
    restart: unless-stopped
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./public
      dockerfile: Dockerfile
    container_name: vue_frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend